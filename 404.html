<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحه پیدا نشد | حسابیست</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, "Segoe UI", sans-serif;
    background: #0f172a; color: #f1f5f9;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .code { font-size: 96px; font-weight: 800; color: #0984e3; line-height: 1; direction: ltr; }
  h1 { font-size: 24px; margin: 16px 0 8px; }
  p { color: #94a3b8; font-size: 15px; line-height: 1.9; }
  a {
    display: inline-block; margin-top: 24px; padding: 12px 28px;
    background: #0984e3; color: #fff; text-decoration: none;
    border-radius: 12px; font-size: 15px; font-weight: 700;
  }
  a:hover { background: #0773c5; }
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>صفحه پیدا نشد</h1>
    <p>آدرسی که دنبالش می‌گردی وجود ندارد یا جابه‌جا شده است.</p>
    <a href="/">بازگشت به صفحه اصلی حسابیست</a>
  </main>
</body>
</html>
